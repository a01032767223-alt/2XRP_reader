name: 시세 수집

on:
  schedule:
    # 21:30 UTC = 06:30 KST (미국 정규장 마감 후)
    - cron: "30 21 * * 1-6"
  workflow_dispatch:
    inputs:
      backfill:
        description: "2년치 실측 데이터로 전면 교체 (최초 1회)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install yfinance

      - name: 시세 수집
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python scripts/fetch_prices.py --backfill
          else
            python scripts/fetch_prices.py
          fi

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/; then
            echo "변경 없음"
            exit 0
          fi
          git add data/
          git commit -m "chore: 시세 수집 $(date -u +'%Y-%m-%d')"
          git push

      - name: 실패 시 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `시세 수집 실패 (${new Date().toISOString().slice(0,10)})`,
              body: `자동 수집이 실패했습니다.\n\n[실행 로그 보기](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })
